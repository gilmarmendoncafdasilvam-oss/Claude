name: Deploy to Vercel

on:
  push:
    branches:
      - claude/marketing-saas-dashboard-7ljj4
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        working-directory: dashboard
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          OUTPUT=$(vercel --token=$VERCEL_TOKEN --yes --prod 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)
          echo "DEPLOY_URL=$URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $URL"

      - name: Save URL to file
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.DEPLOY_URL }}
        run: |
          echo "$DEPLOY_URL" > LAST_DEPLOY_URL.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add LAST_DEPLOY_URL.txt
          git commit -m "ci: update deploy URL [skip ci]" || echo "Nothing to commit"
          git push

      - name: Summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.DEPLOY_URL }}
        run: |
          echo "### ✅ Deploy concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
